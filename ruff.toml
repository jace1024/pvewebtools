# Ruff 配置（结构重构 M1.4 引入）。
#
# 原则：先立一个「当前代码全绿」的保守基线，只拦真正的错误（语法错误 / 未定义名 /
# pyflakes 明显问题），不引入海量风格噪音。基线稳了之后再逐条扩规则。
# 未用导入 / 未用变量（F401 / F841）存量偏多，暂缓——另行专项清理后再开启，
# 否则一上来就是红的，CI 形同虚设。

target-version = "py311"
line-length = 120

extend-exclude = [
    "console",        # 打包/授权管理台，独立工程
    ".venv",
    "build",
    "dist",
]

[lint]
select = ["E9", "F"]
ignore = ["F401", "F841"]
