# pvewebtools 工作区存储配置（项目启动时自动生效，无需手动建存储）
#
# 留空则使用默认值：本机本地 dir 存储 pvewebtools（路径见 WORKSPACE_PATH）
# 想用共享 NFS：只需 NFS_SERVER_MODE=1（本机即 NFS server，自动用本机 LAN IP 导出 WORKSPACE_PATH，
#   零配置；多节点场景其它节点挂载同一导出即可共享 pvewebtools）。也可接独立 NAS：WORKSPACE_TYPE=nfs
#   + NFS_SERVER/NFS_EXPORT 手填。
#
# 说明：
#   - 内容类型固定为下方 CONTENT（默认 backup）。pvewebtools 同时是工具自管文件的存放根目录，固定子目录如下：
#       dump/         —— 传输中心上传的虚机模板（PVE backup 内容目录，PVE 可直接识别）
#       cloud-images/ —— 含 cloud-init 的云镜像（供云镜像建机/制作直接可用）
#       disk-images/  —— 普通磁盘镜像（如 openEuler 等无 cloud-init 的系统，供 qm importdisk 磁盘导入）
#       vbios/        —— vBIOS 主副本
#     四个目录均按绝对路径直接读写（存储根经 storage_path() 定位）。
#     其中 dump/ 为 PVE backup 内容目录；其余三个为项目自管目录，命名刻意避开 PVE 内容目录名。
#     注：CONTENT=backup 时 PVE 使用 <根>/dump 存放备份/模板，虚机模板即落于此处，
#         根下不会再出现 images/ private/ template/ 等 PVE 目录，与项目自管目录互不干扰。
#   - 「目录」还是「NFS」由 WORKSPACE_TYPE 决定：留空=自动(NFS_SERVER_MODE=1 或填了 NFS_SERVER 走 nfs，
#     否则本地 dir)。NFS_SERVER_MODE=1 时本机安装并导出 NFS，项目跑在哪台、哪台就是 NFS server，
#     NFS_SERVER/NFS_EXPORT 不填则自动取本机 IP / WORKSPACE_PATH，无需自备 NAS。
#   - 路径/导出目录须放在【专用磁盘】上，勿用 PVE 系统盘（大文件撑爆系统分区会导致 PVE 异常）。

# 工作区存储 ID（固定，勿改）
WORKSPACE_SID=pvewebtools

# 存储类型：留空=自动(本机兼 NFS server 或填了 NFS_SERVER 走 nfs，否则 dir) / nfs / dir
WORKSPACE_TYPE=

# NFS 模式：server 地址与导出路径。NFS_SERVER_MODE=1 时留空即自动用本机 LAN IP，可不填；
# 接独立 NAS 时才需要手填这两项
NFS_SERVER=
NFS_EXPORT=

# 本地 dir 模式，或 NFS 自管 server 的导出目录
# 注意：若启用 NFS 自管(server)，此目录须在【专用磁盘】上挂载，勿用 PVE 系统盘
#       （云镜像等大文件撑爆系统分区会导致 PVE 异常）
WORKSPACE_PATH=/var/lib/vz/pvewebtools

# 内容类型（PVE content）：默认 备份(backup) + 容器模板(vztmpl)
# 目的：PVE 管理它自己的 <根>/dump（备份/虚机模板）与 <根>/template/cache（容器模板，供「获取 LXC 模板」下载后 PVE 立即可见）；
#       不声明 images/rootdir，避免 PVE 在根下另建 images/ private 目录，与项目自管的 cloud-images/ disk-images/ vbios/ 互不干扰。
# 可选值：images,rootdir,vztmpl,iso,backup,snippets,import；留空表示不声明，交给 PVE 插件默认（dir/nfs 默认=全部内容类型，会建出上述全部目录）
# 想让 pvewebtools 兼作 PVE 的磁盘/容器存储时才追加 images,rootdir；追加 vztmpl/iso 会多出 template/ 目录。
CONTENT=backup,vztmpl
# ---- local 存储内容类型（启动时自动设置）----
# 是否在启动时把本机 local 存储的内容类型设为全量：1=开（默认）0=完全不碰 local 配置
# 打开后 local 才会被后端扫描（磁盘镜像/备份/导入目录等均按 content 过滤）并出现在工具存储下拉里
LOCAL_ALL_CONTENT=1
# 要设置的存储 id（默认 local；若集群里 local 改名或另有所指可修改）
LOCAL_SID=local
# 全量内容列表。import 为较新 PVE 才支持的类型，若被当前版本拒绝会自动退回不含 import 的列表
# 注意：images/rootdir 打开后 PVE 允许把 VM/CT 磁盘建在 local（=系统盘所在文件系统），
#       大文件会挤压根分区；不想要这种效果就把 LOCAL_ALL_CONTENT 设为 0
LOCAL_CONTENT=images,rootdir,vztmpl,iso,backup,snippets,import
# 注：传输中心「上传虚机模板」落到 pvewebtools 根下的 dump/ 子目录（由项目启动时统一创建），
#      即 PVE backup 内容目录，PVE 可直接识别。

# 是否由本机兼任 NFS server（导出 WORKSPACE_PATH 供其它节点挂载）：1=开(默认) 0=关
# 默认开：启动即自动安装/启动 NFS 并导出 WORKSPACE_PATH，pvewebtools 自动成为 NFS 共享存储
# （NFS_SERVER 取本机 LAN IP、NFS_EXPORT 取 WORKSPACE_PATH，项目跑在哪台、哪台就是 NFS server，
# 无需自备 NAS）。多节点时其它节点挂载同一导出即可共享 pvewebtools。
# 仅想用本地 dir 存储时设为 0。
NFS_SERVER_MODE=1

# 兼任 NFS server 时允许访问的导出网段
LAN_CIDR=192.168.0.0/16
