name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Shell lint
        run: python scripts/lint_shell.py

      - name: Tool source lint
        run: python scripts/lint_tool_sources.py

      - name: Pytest
        run: pytest
